<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <title>Opening in Gater…</title>
    <!-- Meta-refresh works even when this page is injected via document.write
         (the loading page swaps us in), independent of script execution. -->
    <meta http-equiv="refresh" content="0; url={{ base_path }}/{{ datasource }}">
    <script>
        window.location.replace("{{ base_path }}/{{ datasource }}");
    </script>
    <style>
        body { font-family: -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
               background: #1b1b1b; color: #eee; margin: 0; text-align: center; }
        .msg { max-width: 560px; margin: 18vh auto 0; padding: 0 24px; }
        .msg h2 { font-weight: 500; font-size: 20px; }
        .msg a { color: #43a047; }
    </style>
</head>
<body>
<div class="msg">
    <h2>Restoring “{{ datasource }}” from OMERO…</h2>
    <p>If you are not redirected, <a href="{{ base_path }}/{{ datasource }}">click here</a>.</p>
</div>
</body>
</html>
