{% extends 'base.html' %}

{% block style %}
<link rel="stylesheet" href="{{ base_path }}/client/src/css/viewer.css">
<link rel="stylesheet" href="{{ base_path }}/client/src/css/gating.css">
{% endblock %}

{% block content %}

{% if data.datasource %}
<div id="container" class="container">
    <div id="bodyDiv">
        <div id="channel_list_wrapper">
            <div id="lowRow1" class="row">
                <div id="boxHeading1" class="col-auto">
                    <span class="box-heading">Channels</span>
                </div>
                <div class="" id="download-channels-header-div">
                    <span id="channels_upload_icon_db" class="fas fa-upload" title="Load Channels from OMERO"></span>
                    <span id="channels_download_icon_db" class="fas fa-download" title="Save Channels to OMERO"></span>
                    <span id="channels_upload_icon" class="fas fa-file-upload" title="Load Channels from a CSV on OMERO"></span>
                    <span id="channels_download_icon" class="fas fa-file-download" title="Save Channels as a CSV on OMERO"></span>
                </div>
                <div class="col-auto" id="selected-channels-header-div">
                    <span class="selected-channels-header" id="num-selected-channels">0</span>
                    <span class="selected-channels-header">of 4 Selected</span>
                </div>
            </div>
            <div class="list" id="channel_list">
                <div class="row">
                    <div class="col-auto">
                        <div class="lds-ellipsis" id="channel_list_loader">
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div id="openseadragon_wrapper">
            <div id="lowRow2" class="row">
                <div class="col-auto" id="scalebar-header-div">
                </div>
            </div>
            <div id="openseadragon">
                <div class="row">
                    <div class="col-auto">
                        <div class="lds-ellipsis" id="openseadragon_loader">
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div id="csv_channel_list_wrapper">
            <div id="gating_download_panel">
                <a id="gating_exit">&#10006;</a>
                <label>Save gated channel ranges to OMERO:
                    <span class="download_flex">
                            <input id="download_input1" type="text" autocomplete="false" spellcheck="false"
                                   value="{{ data.datasource }}_gated_channel_ranges.csv">
                            <a id="download_gated_channel_ranges" class="download_button"
                               title="Save gated channel ranges to OMERO"><span
                                    class="fas fa-file-download"></span></a>
                        </span>
                </label>
                <label>Save gated cell encodings to OMERO:
                    <span class="download_flex">
                            <input id="download_input2" type="text" autocomplete="false" spellcheck="false"
                                   value="{{ data.datasource }}_gated_cell_encodings.csv">
                            <a id="download_gated_cell_encodings" class="download_button"
                               title="Save gated cell encodings to OMERO"><span
                                    class="fas fa-file-download"></span></a>
                        </span>
                </label>
                <label>Cell Encoding:
                    <select id="encoding">
                        <option value="binary" selected>Binary Values</option>
                        <option value="intensity">Intensity Values</option>
                    </select>
                </label>
            </div>
            <div id="lowRow3" class="row">
                <div id="boxHeading3" class="col-auto">
                    <span class="box-heading">CSV Gating</span>
                </div>

                <div class="" id="download-gating-header-div">
                    <span id="gating_upload_icon_db" class="fas fa-upload" title="Load Gating from OMERO"></span>
                    <span id="gating_download_icon_db" class="fas fa-download" title="Save Gating to OMERO"></span>
                    <span id="gating_upload_icon" class="fas fa-file-upload" title="Load Gating from a CSV on OMERO"></span>
                    <span id="gating_download_icon" class="fas fa-file-download" title="Save Gating as a CSV on OMERO"></span>
                </div>

                <span id="lasso_selection_toggle_plus" class="far fa-plus-square lasso_selection_toggle" title="Toggle Selection"></span>
                <span id="lasso_selection_toggle_minus" class="far fa-minus-square lasso_selection_toggle" style="display: none" title="Toggle Selection"></span>
            </div>

            <div class="list" id="csv_gating_list">
                <div id="csv_gating_row" class="row">
                    <div class="col-auto">
                        <div class="lds-ellipsis" id="csv_gating_list_loader">
                            <div></div>
                            <div></div>
                            <div></div>
                            <div></div>
                        </div>
                    </div>
                </div>
                <div id="drag-and-drop-info">
                    <div class="d-flex justify-content-md-center align-items-center vh-100">
                        <span id="drag-and-drop-text">Drag and Drop A Gating CSV File</span>
                    </div>
                </div>
            </div>
            <div id="gating_controls_panel">
                <label class="selected-channels-header">Scalebar
                    <input id="controls_scalebar" type="checkbox" checked>
                </label>
                <label>Outlines
                    <input id="gating_controls_outlines" type="checkbox" checked>
                </label>
                <label>Centroids
                    <input id="gating_controls_centroids" type="checkbox">
                </label>
            </div>
        </div>
    </div>
</div>
<script src="{{ base_path }}/client/src/js/main.js" defer></script>
{% endif %}
{% endblock %}
